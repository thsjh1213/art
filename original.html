<title>신사임당 초충도 원화</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* layout: one painting at a time, full width, like a single panel taken off the folding screen */
:root {
  --paper: #f6f1e6; --ink: #2b2520; --muted: #786b5c; --seal: #a8382a; --line: #d9cdb8; --mount: #ece3d2;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1a16; --ink: #efe7d8; --muted: #b3a690; --seal: #e07a63; --line: #3d362d; --mount: #27231d; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #1d1a16; --ink: #efe7d8; --muted: #b3a690; --seal: #e07a63; --line: #3d362d; --mount: #27231d; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); }
main { max-width: 760px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.work { margin: 0; display: grid; gap: 6px; }
.work[hidden] { display: none; }
.eyebrow { margin: 0; color: var(--seal); font-weight: 700; font-size: 1rem; letter-spacing: .04em; }
h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 900; text-wrap: balance; }
.work img { width: 100%; height: auto; display: block; background: var(--mount); padding: 10px; box-sizing: border-box;
  border: 1px solid var(--line); }
.note { color: var(--muted); font-size: .95rem; line-height: 1.6; margin: 14px 0 0; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
nav a { color: var(--ink); text-decoration: none; font-size: .95rem; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; }
nav a[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
nav a:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
</style>
